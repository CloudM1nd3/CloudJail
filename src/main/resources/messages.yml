# Цвета: &a &c &e &f и остальные коды Minecraft.
# {prefix} заменяется значением ключа prefix.
# %плейсхолдер% заменяется плагином. Над сообщением перечислено, какие из них в него подставляются.

# Подставляется вместо {prefix}.
prefix: '&8[&bCloudJail&8]&r '

# Общие ответы команд.
command:
  no-permission: '{prefix}&cУ вас нет прав на выполнение этой команды.'
  only-player: '{prefix}&cЭту команду можно использовать только в игре.'

  # %player% — введённый ник
  player-not-found: '{prefix}&cИгрок &e%player%&c не найден!'

  error: '{prefix}&cПроизошла ошибка. Подробности в консоли.'
  reload-success: '{prefix}&aКонфигурация и языковые файлы перезагружены.'
  reload-failed: '{prefix}&cОшибка при перезагрузке. Смотрите в консоль.'

  usage-jail: '{prefix}&cИспользование: /jail <ник> <тюрьма> <время> [причина]'
  usage-unjail: '{prefix}&cИспользование: /unjail <ник>'
  usage-history: '{prefix}&cИспользование: /jailhistory <ник> [страница]'
  usage-punishments: '{prefix}&cИспользование: /jailpunishments <ник> [страница]'
  usage-jailed-players: '{prefix}&cИспользование: /jailedplayers [страница]'
  usage-create: '{prefix}&cИспользование: /jailadmin create <имя> [-n]'
  usage-delete: '{prefix}&cИспользование: /jailadmin delete <имя>'
  usage-teleport: '{prefix}&cИспользование: /jailadmin teleport <имя>'
  usage-jailcheck: '{prefix}&cИспользование: /jailcheck <ник>'

# Общие куски для списков наказаний: /jailhistory, /jailpunishments, /jailedplayers, /jailcheck, /jailinfo.
format:
  date:
    # Шаблон даты для %date%.
    pattern: "dd MMMM yyyy HH:mm:ss"
    timezone: "Europe/Moscow"
    locale: "ru-RU"

  # Подписи единиц времени, от недель к секундам.
  time-units:
    weeks: "н."
    days: "д."
    hours: "ч."
    minutes: "мин."
    seconds: "с."

  # Текст для %remaining% в строках списков. У неактивного наказания пусто.
  # %time% — оставшееся время
  remaining-time: '&c(Осталось: &e%time%&c)'

  # Текст для %status%.
  # %unjailer% — кто освободил только у released
  status:
    active: '&aактивно'
    expired: '&eзавершено'
    released: '&eпомилован %unjailer%'

# /jail и /unjail. Сообщения посаженному игроку — в этом же блоке.
jail:
  # %player% — ник, %jail% — тюрьма
  jail-success: '{prefix}&cИгроку &e%player%&c порвут туза в тюрьме &e%jail%&c!'

  # %player%
  already-jailed: '{prefix}&cИгрок &e%player%&c уже отбывает срок под шконкой!'

  # %player%
  unjail-success: '{prefix}&cИгрок &e%player%&c освобождён.'

  # %player%
  not-jailed: '{prefix}&e%player% &cне отбывает срок.'

  # Подставляется, если причину не написали.
  no-reason: 'Не указана'

  # Формат срока: число и буква, можно склеивать. s m h d w — секунды, минуты, часы, дни, недели.
  invalid-time: '{prefix}&cНеверный формат времени. Примеры: &e30s&c, &e90m&c, &e1h30m&c, &e2d&c.'

  set-jailed: '{prefix}&cВас посадили в тюрягу. Узнать срок, причину можно в скорборде справа или по &e[/jailinfo]'
  set-released: '{prefix}&aВас выпустили из тюрьмы. Не нарушайте правила сервера &e[/rules]!'
  term-ended: '{prefix}&aВаш срок в тюрьме закончен. Не нарушайте правила сервера &e[/rules]!'

# Анонс в чат. Кому его слать, задаётся в config.yml: announcements.chat.
# Пустое право — всем онлайн и в консоль. Для посаженного игрока свои сообщения, сообщения из announcer он не видит.
announce:
  # %player% %jail% %time% %reason% %punisher%
  jailed: "{prefix}&cИгрок &e%player%&c посажен в тюрьму &e%jail%&c на &e%time%&c Причина: &e%reason%&c. Выдал: &e%punisher%"

  # %player% %unjailer% %unjail_reason%
  released: "{prefix}&aИгрок &e%player%&a освобождён. Освободил: &e%unjailer%&a. Причина: &e%unjail_reason%"

  # %player%
  expired: ""

# /jailadmin. %name% — название тюрьмы.
jailadmin:
  created: '{prefix}&aТюрьма &e%name%&a создана.'
  exists: '{prefix}&cТюрьма &e%name%&c уже существует. Чтобы пересоздать, добавьте &e-n&c в конец команды.'
  deleted: '{prefix}&aТюрьма &e%name%&a удалена.'
  not-found: '{prefix}&cТюрьма &e%name%&c не найдена.'
  name-invalid: '{prefix}&cИмя тюрьмы должно состоять только из латинских букв и/или цифр!'
  teleportation: '{prefix}Телепортация...'

# /jailhistory. Эти же строки использует /jailcheck.
history:
  # %player%
  empty: '{prefix}&cИстория наказаний игрока &e%player%&c пуста.'

  # %player% %page% %pages%
  header: '{prefix}&cИстория наказаний игрока &e%player%&c (страница &f%page%&e/&f%pages%&e):'

  # %id% %date% %jail% %time% %punisher% %reason% %status% %remaining%
  lines:
    - '&7┌&e#%id%&c. (&e%date%&c)'
    - '&7├&cТюрьма - &e%jail%&c, срок - &e%time%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7├&cПричина: &e%reason%'
    - '&7└&cСтатус: &e%status% %remaining%'

  # %page% %pages%
  page-invalid: '{prefix}&cСтраницы &e%page%&c нет. Всего страниц: &e%pages%&c.'

# /jailpunishments
punishments:
  # %player%
  empty: '{prefix}&cИгрок &e%player%&c не наказывал других игроков.'

  # %player% %page% %pages%
  header: '{prefix}&cИстория выданных &e%player%&c наказаний (страница &f%page%&e/&f%pages%&e):'

  # %id% %player% %date% %jail% %time% %reason% %status% %remaining%
  lines:
    - '&7┌&e#%id%&c. &e%player%&c (&e%date%&c)'
    - '&7├&cТюрьма - &e%jail%&c, срок - &e%time%'
    - '&7├&cПричина: &e%reason%'
    - '&7└&cСтатус: &e%status% %remaining%'

# /jailedplayers
jailed-players:
  empty: '{prefix}&cНикто не сидит в тюрьме.'

  # %page% %pages%
  header: '{prefix}&cАктивные наказания (страница &f%page%&e/&f%pages%&e):'

  # %id% %player% %date% %jail% %time% %punisher% %reason% %status% %remaining%
  lines:
    - '&7┌&e#%id%&c. &e%player%&c (&e%date%&c)'
    - '&7├&cТюрьма - &e%jail%&c, срок - &e%time%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7├&cПричина: &e%reason%'
    - '&7└&cСтатус: &e%status% %remaining%'

# /jailinfo
info:
  not-jailed: '{prefix}&cВы не находитесь в тюрьме.'

  # %jail% %time% %remaining% %punisher% %reason%
  lines:
    - '&7┌&cИнформация о вашем наказании:'
    - '&7├&cТюрьма: &e%jail%'
    - '&7├&cСрок: &e%time%'
    - '&7├&cОсталось: &e%remaining%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7└&cПричина: &e%reason%'

# Надписи над хотбаром, когда действие в тюрьме запрещено.
deny:
  break: '{prefix}&cВ тюрьме запрещено ломать блоки.'
  place: '{prefix}&cВ тюрьме запрещено ставить блоки.'
  interact: '{prefix}&cВ тюрьме запрещено использовать предметы.'
  consume: '{prefix}&cВыйди из тюрьмы, потом поешь.'
  damage: '{prefix}&cНельзя драться, срок добавлю.'
  chat: '{prefix}&cПисать в чат нельзя, учи азбуку Морзе.'
  command: '{prefix}&cВ тюрьме запрещено использовать эту команду.'
  item-drop: '&cВ тюрьме запрещено выбрасывать предметы.'
  item-pick-up: '&cВ тюрьме запрещено подбирать предметы.'

# Тексты плейсхолдеров PlaceholderAPI.
placeholder-api:
  jailed: 'Арестован'
  not-jailed: 'На свободе'

  # %time% — оставшееся время
  remaining: 'Оставшееся время: %time%'
