# ==========================================================================
#  CloudJail - сообщения плагина
# ==========================================================================
#  Цвета: &a &c &e &f и т.д. (стандартные цветовые коды Minecraft).
#  {prefix} заменяется значением ключа "prefix".
#  Плейсхолдеры вида %player% заменяются плагином. Доступные для каждого
#  сообщения указаны в комментарии над ним, другие работать не будут.
# ==========================================================================

# Префикс, который подставляется вместо {prefix}.
prefix: '&8[&bCloudJail&8]&r '

# ==========================================================================
#  Общие сообщения и подсказки по командам
# ==========================================================================
command:
  no-permission: '{prefix}&cУ вас нет прав на выполнение этой команды.'
  only-player: '{prefix}&cЭту команду можно использовать только в игре.'

  # Доступно: %player% - введённый ник
  player-not-found: '{prefix}&cИгрок &e%player%&c не найден!'

  # Общая ошибка, подробности выводятся в консоль.
  error: '{prefix}&cПроизошла ошибка. Подробности в консоли.'

  reload-success: '{prefix}&aКонфигурация и языковые файлы перезагружены.'
  reload-failed: '{prefix}&cОшибка при перезагрузке. Смотрите в консоль.'

  # Подсказки по использованию команд
  usage-jail: '{prefix}&cИспользование: /jail <ник> <тюрьма> <время> [причина]'
  usage-unjail: '{prefix}&cИспользование: /unjail <ник>'
  usage-history: '{prefix}&cИспользование: /jailhistory <ник> [страница]'
  usage-punishments: '{prefix}&cИспользование: /jailpunishments <ник> [страница]'
  usage-create: '{prefix}&cИспользование: /jailadmin create <имя> [-n]'
  usage-delete: '{prefix}&cИспользование: /jailadmin delete <имя>'
  usage-teleport: '{prefix}&cИспользование: /jailadmin teleport <имя>'

# ==========================================================================
#  Общие элементы оформления.
#  Используются в /jailhistory и /jailpunishments
# ==========================================================================
format:
  # Текст для плейсхолдера %remaining% в строках наказаний.
  # Показывается только у активных наказаний.
  # Доступно: %time% - оставшееся время
  remaining-time: '(Осталось: &e%time%)'

# ==========================================================================
#  /jail и /unjail
# ==========================================================================
jail:
  # Доступно: %player% - ник игрока, %jail% - название тюрьмы,
  #           %time% - срок (например "1ч 30м")
  jail-success: '{prefix}&cИгроку &e%player%&c порвут туза в тюрьме &e%jail%&c!'

  # Доступно: %player%
  already-jailed: '{prefix}&cИгрок &e%player%&c уже отбывает срок под шконкой!'

  # Доступно: %player%
  unjail-success: '{prefix}&cИгрок &e%player%&c освобождён.'

  # Доступно: %player%
  not-jailed: '{prefix}&e%player% &cне отбывает срок.'

  # Причина по умолчанию, если администратор не указал её.
  no-reason: 'Нарушение правил сервера.'

  # Неверный формат времени.
  # Формат: число + единица, можно комбинировать.
  # s - секунды, m - минуты, h - часы, d - дни, w - недели.
  invalid-time: '{prefix}&cНеверный формат времени. Примеры: &e30s&c, &e90m&c, &e1h30m&c, &e2d&c.'

# ==========================================================================
#  /jailadmin - управление тюрьмами
#  Во всех сообщениях этого блока доступно: %name% - название тюрьмы
# ==========================================================================
jailadmin:
  created: '{prefix}&aТюрьма &e%name%&a создана.'
  exists: '{prefix}&cТюрьма &e%name%&c уже существует. Чтобы пересоздать, добавьте &e-n&c в конец команды.'
  deleted: '{prefix}&aТюрьма &e%name%&a удалена.'
  not-found: '{prefix}&cТюрьма &e%name%&c не найдена.'
  name-invalid: '{prefix}&cИмя тюрьмы должно состоять только из латинских букв и/или цифр!'
  teleportation: '{prefix}Телепортация...'

# ==========================================================================
#  /jailhistory
# ==========================================================================
history:
  # Доступно: %player%
  empty: '{prefix}&cИстория наказаний игрока &e%player%&c пуста.'

  # Заголовок страницы.
  # Доступно: %player%, %page% - текущая страница, %pages% - всего страниц
  header: '{prefix}&cИстория наказаний игрока &e%player%&c (страница &f%page%&e/&f%pages%&e):'

  # Блок строк, выводится для каждого наказания на странице.
  # Доступно: %id% - номер наказания, %jail% - тюрьма, %time% - срок,
  #           %remaining% - текст из format.remaining-time (у неактивных пусто),
  #           %punisher% - кто посадил, %reason% - причина,
  #           %status% - статус из format.status
  lines:
    - '&7┌&e#%id%&c. Тюрьма - &e%jail%&c, время - &e%time% %remaining%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7├&cПричина: &e%reason%'
    - '&7└&cСтатус: &e%status%'

  # Запрошена несуществующая страница.
  # Доступно: %page% - введённая страница, %pages% - всего страниц
  page-invalid: '{prefix}&cСтраницы &e%page%&c нет. Всего страниц: &e%pages%&c.'

# ==========================================================================
#  /jailpunishments - наказания, выданные игроком
# ==========================================================================
punishments:
  # Доступно: %player%
  empty: '{prefix}&cИгрок &e%player%&c не наказывал других игроков.'

  # Заголовок страницы.
  # Доступно: %player%, %page% - текущая страница, %pages% - всего страниц
  header: '{prefix}&cИстория выданных &e%player%&c наказаний (страница &f%page%&e/&f%pages%&e):'

  # Блок строк, выводится для каждого наказания на странице.
  # Доступно: %id% - номер наказания, %jail% - тюрьма, %time% - срок,
  #           %remaining% - текст из format.remaining-time (у неактивных пусто),
  #           %punisher% - кто посадил, %reason% - причина,
  #           %status% - статус из format.status
  lines:
    - '&7┌&e#%id%&c. Тюрьма - &e%jail%&c, время - &e%time% %remaining%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7├&cПричина: &e%reason%'
    - '&7└&cСтатус: &e%status%'

# ==========================================================================
#  /jailedplayers - список игроков в тюрьме
# ==========================================================================
jailed-players:
  empty: '{prefix}&cНикто не сидит в тюрьме.'

  # Заголовок страницы.
  # Доступно: %page% - текущая страница, %pages% - всего страниц
  header: '{prefix}&cАктивные наказания (страница &f%page%&e/&f%pages%&e):'

# ==========================================================================
#  /jailinfo - информация о собственном наказании
# ==========================================================================
info:
  # Игрок не находится в тюрьме.
  not-jailed: '{prefix}&cВы не находитесь в тюрьме.'

  # Блок строк, выводится при /jailinfo.
  # Доступно: %jail% - тюрьма, %time% - срок, %remaining% - оставшееся время,
  #           %punisher% - кто посадил, %reason% - причина
  lines:
    - '&7┌&cИнформация о вашем наказании:'
    - '&7├&cТюрьма: &e%jail%'
    - '&7├&cСрок: &e%time%'
    - '&7├&cОсталось: &e%remaining%'
    - '&7├&cАдминистратор: &e%punisher%'
    - '&7└&cПричина: &e%reason%'

# ==========================================================================
#  Запреты для игроков в тюрьме.
#  Показываются над хотбаром (actionbar)
# ==========================================================================
deny:
  break: '&cВ тюрьме запрещено ломать блоки.'
  place: '&cВ тюрьме запрещено ставить блоки.'
  interact: '&cВ тюрьме запрещено использовать предметы.'
  consume: '&cВыйди из тюрьмы, потом поешь.'
  damage: '&cНельзя драться, срок добавлю.'
  chat: '&cПисать в чат нельзя, учи азбуку Морзе.'
  command: '&cВ тюрьме запрещено использовать эту команду.'