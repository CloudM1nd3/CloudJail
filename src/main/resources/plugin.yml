name: CloudJail
version: '${version}'

main: org.cloudplugins.cloudJail.CloudJail
api-version: '26.3'
load: POSTWORLD
softdepend: [voicechat, PlasmoVoice, Essentials]


commands:
  jail:
    description: Посадить игрока в тюрьму
    usage: /jail <ник> <тюрьма> <время> [причина]
  unjail:
    description: Освободить игрока
    usage: /unjail <ник>
  jailhistory:
    description: История наказаний игрока
    usage: /jailhistory <ник> [страница]
    aliases: [jailhist]
  jailpunishments:
    description: История выданных наказаний игроком
    usage: /jailpunishments <ник> [страница]
    aliases: [jailpunish]
  jailadmin:
    description: Управление тюрьмами
    usage: /jailadmin <create|delete|tp|reload>
    aliases: [ja]
  jailinfo:
    description: Информация о Вашем на казании
    usage: /jailinfo
    aliases: [jinfo]