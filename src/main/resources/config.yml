# Идёт ли время наказания, пока игрок НЕ на сервере.
isOfflineProgressEnabled: false

# Идёт ли время наказания, пока игрок в AFK.
# Работает только если на сервере установлен EssentialsX.
isAFKProgressEnabled: false

#Время для автосейва в БД (Default = 10min / 600 sec), 0 = без автосейва B)
autosave: 600

PlaceHolderAPI:
  jailed: 'Арестован'
  not_jailed: 'На свободе'
  #%time% - отформатированное время, например (1ч 10м)
  remaining: 'Оставшееся время: %time%'

# Скорборд справа.
# После освобождения возвращается предыдущий скорборд игрока.
# Плейсхолдеры: %punisher%, %reason%, %time%, %remaining%, %jail% %player%
# Не больше 15 строк — лимит ванильного борда =3
scoreboard:
  enable: true

  title: "&6&lТюрьма"

  lines:
    - '&7&m---------------------'
    - '&cМодератор: &e%punisher%'
    - '&cПричина: &e%reason%'
    - ''
    - '&cСрок: &e%time%'
    - '&cОсталось: &6%remaining%'
    - '&7&m---------------------'

# -------------------------------------------------------------------------
#  Запреты для игроков в тюрьме
# -------------------------------------------------------------------------
deny:
  # Запретить говорить в голосовом чате (слышать игрок продолжит).
  # Работает, если установлен Simple Voice Chat и/или Plasmo Voice.
  voice-chat: true

  # Запретить писать в чат
  chat: true

  # Запретить перемещаться (поворачивать голову можно)
  movement: false

  # Запретить есть и пить (LOL)
  consume: false

  # Запретить команды, кроме перечисленных в allowed-commands
  commands:
    enable: true
    # Команды, разрешённые в тюрьме (пишутся со слэшем, в нижнем регистре)
    allowed-commands:
      - /rules
      - /links
      - /jailinfo

#Вебхуки.
Webhooks:
  Discord:
    enable: false
    url: '<PASTE YOUR WEBHOOK URL HERE>'
    templates:
      jailed: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "🔒 Игрок посажен в тюрьму",
            "color": 15158332,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "⏱ Срок", "value": "{duration}", "inline": true },
              { "name": "🏛 Тюрьма", "value": "{jail}", "inline": true },
              { "name": "📋 Причина", "value": "{reason}", "inline": false },
              { "name": "👮 Выдал", "value": "`{punisher}`", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      released: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "✅ Игрок освобождён",
            "color": 3066993,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "🔓 Освободил", "value": "`{unjailer}`", "inline": true },
              { "name": "📝 Причина освобождения", "value": "{unjail_reason}", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      expired: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "⌛ Срок наказания истёк",
            "color": 3447003,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "📌 Статус", "value": "Автоматически освобождён, срок полностью отбыт", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }

  Telegram:
    enable: false
    bot-token: ''
    chat-id: ''
    templates:
      jailed: |
        {
          "parse_mode": "HTML",
          "text": "<b>🔒 Игрок посажен в тюрьму</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ ⏱ Срок: <b>{duration}</b>\n├ 🏛 Тюрьма: <code>{jail}</code>\n├ 📋 Причина: <i>{reason}</i>\n└ 👮 Выдал: <code>{punisher}</code>\n\n🕒 {current_date}"
        }
      released: |
        {
          "parse_mode": "HTML",
          "text": "<b>✅ Игрок освобождён</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ 🔓 Освободил: <code>{unjailer}</code>\n└ 📝 Причина освобождения: <i>{unjail_reason}</i>\n\n🕒 {current_date}"
        }
      expired: |
        {
          "parse_mode": "HTML",
          "text": "<b>⌛ Срок наказания истёк</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n└ 📌 Статус: автоматически освобождён, срок полностью отбыт\n\n🕒 {current_date}"
        }

#Список тюрем, заполняется командами плагина автоматически, менять тут что-то вручную смысла нет B)
Jails: []