# Идёт ли время наказания, пока игрок НЕ на сервере.
isOfflineProgressEnabled: false

# Идёт ли время наказания, пока игрок в AFK.
# Работает только если на сервере установлен EssentialsX.
isAFKProgressEnabled: false

#Время для автосейва в БД (Default = 10min / 600 sec), 0 = без автосейва B)
autosave: 600

PlaceHolderAPI:
  jailed: 'Арестован'
  not_jailed: 'На свободе'
  #%time% - отформатированное время, например (1ч 10м)
  remaining: 'Оставшееся время: %time%'

# Скорборд справа.
# После освобождения возвращается предыдущий скорборд игрока.
# Плейсхолдеры: %punisher%, %reason%, %time%, %remaining%, %jail% %player%
# Не больше 15 строк — лимит ванильного борда =3
scoreboard:
  enable: true

  title: "&6&lТюрьма"

  lines:
    - '&7&m---------------------'
    - '&cМодератор: &e%punisher%'
    - '&cПричина: &e%reason%'
    - ''
    - '&cСрок: &e%time%'
    - '&cОсталось: &6%remaining%'
    - '&7&m---------------------'

# -------------------------------------------------------------------------
#  Запреты для игроков в тюрьме
# -------------------------------------------------------------------------
deny:
  # Запретить говорить в голосовом чате (слышать игрок продолжит).
  # Работает, если установлен Simple Voice Chat и/или Plasmo Voice.
  voice-chat: true

  # Запретить писать в чат
  chat: true

  # Запретить перемещаться (поворачивать голову можно)
  movement: false

  # Запретить есть и пить (LOL)
  consume: false

  # Запретить команды, кроме перечисленных в allowed-commands
  commands:
    enable: true
    # Команды, разрешённые в тюрьме (пишутся со слэшем, в нижнем регистре)
    allowed-commands:
      - /rules
      - /links
      - /jailinfo

# ==================================================================
#  ВЕБХУКИ (Discord / Telegram)
# ==================================================================
#  Уведомления о наказаниях в Discord-канал и/или Telegram-чат.
#  Для каждого события есть свой шаблон. Шаблон это JSON-текст,
#  в который плагин подставляет значения вместо {плейсхолдеров}.
#
#  СОБЫТИЯ (ключи в templates):
#    jailed   - игрок посажен в тюрьму
#    released - игрок освобождён вручную (командой)
#    expired  - срок наказания истёк
#
#  Чтобы отключить событие, оставьте шаблон пустым в кавычках:
#    expired: ""
#
#  ПЛЕЙСХОЛДЕРЫ:
#    {player}          - ник игрока
#    {punisher}        - кто выдал наказание
#    {reason}          - причина наказания
#    {jail}            - название тюрьмы
#    {duration}        - срок наказания
#    {unjailer}        - кто освободил игрока
#    {unjail_reason}   - причина освобождения
#    {current_date}    - дата и время отправки сообщения (самого события)
#    {punishment_date} - дата и время выдачи наказания
#
#  Если значение отсутствует (например, {unjailer} в событии jailed),
#  вместо него будет прочерк "—".
#  Спецсимволы и HTML в подставляемых значениях экранируются сами.
#
#  ГДЕ СОЗДАТЬ JSON-ШАБЛОН:
#    Discord:  https://discohook.app
#      Соберите сообщение визуально, нажмите "JSON Editor" -> "Copy JSON"
#      и вставьте результат в шаблон. Плейсхолдеры {player}, {reason}
#      и т.д. можно писать прямо в тексте полей.
#      Оставьте в шаблоне "allowed_mentions": { "parse": [] },
#      иначе причина вида @everyone будет реально пинговать людей.
#
#    Telegram: визуального конструктора нет, сообщение это обычный
#      текст с HTML-разметкой в поле "text". Доступные теги:
#      <b> <i> <u> <s> <code> <pre> <a href="..."> <blockquote>
#      Справка: https://core.telegram.org/bots/api#html-style
#      Переносы строк пишутся как \n. Поле "parse_mode" должно
#      оставаться "HTML".
#
#  КАК НАСТРОИТЬ:
#    Discord:  Настройки канала -> Интеграции -> Вебхуки -> создать
#              вебхук -> скопировать URL в поле url.
#    Telegram: создайте бота через @BotFather (токен в bot-token),
#              добавьте бота в чат и укажите id чата в chat-id
#              (для групп и каналов он начинается с -100).
#
#  URL вебхука и токен бота это пароли. Никому их не показывайте.
#  После изменений выполните перезагрузку конфига плагина.
# ==================================================================
Webhooks:
  Discord:
    enable: false
    url: '<PASTE YOUR WEBHOOK URL HERE>'
    templates:
      jailed: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "🔒 Игрок посажен в тюрьму",
            "color": 15158332,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "⏱ Срок", "value": "{duration}", "inline": true },
              { "name": "🏛 Тюрьма", "value": "{jail}", "inline": true },
              { "name": "📋 Причина", "value": "{reason}", "inline": false },
              { "name": "👮 Выдал", "value": "`{punisher}`", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      released: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "✅ Игрок освобождён",
            "color": 3066993,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "🔓 Освободил", "value": "`{unjailer}`", "inline": true },
              { "name": "📝 Причина освобождения", "value": "{unjail_reason}", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      expired: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "⌛ Срок наказания истёк",
            "color": 3447003,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "📌 Статус", "value": "Автоматически освобождён, срок полностью отбыт", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }

  Telegram:
    enable: false
    bot-token: ''
    chat-id: ''
    templates:
      jailed: |
        {
          "parse_mode": "HTML",
          "text": "<b>🔒 Игрок посажен в тюрьму</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ ⏱ Срок: <b>{duration}</b>\n├ 🏛 Тюрьма: <code>{jail}</code>\n├ 📋 Причина: <i>{reason}</i>\n└ 👮 Выдал: <code>{punisher}</code>\n\n🕒 {current_date}"
        }
      released: |
        {
          "parse_mode": "HTML",
          "text": "<b>✅ Игрок освобождён</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ 🔓 Освободил: <code>{unjailer}</code>\n└ 📝 Причина освобождения: <i>{unjail_reason}</i>\n\n🕒 {current_date}"
        }
      expired: |
        {
          "parse_mode": "HTML",
          "text": "<b>⌛ Срок наказания истёк</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n└ 📌 Статус: автоматически освобождён, срок полностью отбыт\n\n🕒 {current_date}"
        }

#Список тюрем, заполняется командами плагина автоматически, менять тут что-то вручную смысла нет B)
Jails: []