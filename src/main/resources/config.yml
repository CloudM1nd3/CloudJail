# Идёт ли время наказания, пока игрок НЕ на сервере.
isOfflineProgressEnabled: false

# Идёт ли время наказания, пока игрок в AFK.
# Работает только если на сервере установлен EssentialsX.
isAFKProgressEnabled: false

#Время для автосейва в БД (Default = 10min / 600 sec), 0 = без автосейва B)
autosave: 600

PlaceHolderAPI:
  jailed: 'Арестован'
  not_jailed: 'На свободе'
  #%time% - отформатированное время, например (1ч 10м)
  remaining: 'Оставшееся время: %time%'

# Скорборд справа.
# После освобождения возвращается предыдущий скорборд игрока.
# Плейсхолдеры: %punisher%, %reason%, %time%, %remaining%, %jail% %player%
# Не больше 15 строк — лимит ванильного борда =3
scoreboard:
  enable: true

  title: "&6&lТюрьма"

  lines:
    - '&7&m---------------------'
    - '&cМодератор: &e%punisher%'
    - '&cПричина: &e%reason%'
    - ''
    - '&cСрок: &e%time%'
    - '&cОсталось: &6%remaining%'
    - '&7&m---------------------'

# -------------------------------------------------------------------------
#  Запреты для игроков в тюрьме
# -------------------------------------------------------------------------
deny:
  # Запретить говорить в голосовом чате (слышать игрок продолжит).
  # Работает, если установлен Simple Voice Chat и/или Plasmo Voice.
  voice-chat: true

  # Запретить писать в чат
  chat: true

  # Запретить перемещаться (поворачивать голову можно)
  movement: false

  # Запретить есть и пить (LOL)
  consume: false

  # Запретить команды, кроме перечисленных в allowed-commands
  commands:
    enable: true
    # Команды, разрешённые в тюрьме (пишутся со слэшем, в нижнем регистре)
    allowed-commands:
      - /rules
      - /links
      - /jailinfo

#Вебхуки.
Webhooks:
  Discord:
    enable: false
    url: '<PASTE YOUR WEBHOOK URL HERE>'
    templates:
      jailed: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "🔒 Игрок посажен в тюрьму",
            "description": "**`{player}`** отправлен в тюрьму",
            "color": 15158332,
            "fields": [
              {
                "name": "📋 Причина",
                "value": "{reason}",
                "inline": true
              },
              {
                "name": "⏱ Срок",
                "value": "{duration}",
                "inline": true
              },
              {
                "name": "👮 Выдал",
                "value": "`{punisher}`",
                "inline": false
              }
            ],
            "footer": {
              "text": "Система наказаний"
            }
          }]
        }

      released: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "✅ Игрок освобождён",
            "description": "**`{player}`** выпущен из тюрьмы",
            "color": 3066993,
            "fields": [
              {
                "name": "🔓 Освободил",
                "value": "`{unjailer}`",
                "inline": true
              },
              {
                "name": "📝 Причина",
                "value": "{unjail_reason}",
                "inline": true
              }
            ],
            "footer": {
              "text": "Система наказаний"
            }
          }]
        }
      expired: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "⌛ Срок наказания истёк",
            "description": "**`{player}`** автоматически освобождён из тюрьмы",
            "color": 3447003,
            "fields": [
              {
                "name": "Статус",
                "value": "Срок наказания полностью отбыт",
                "inline": false
              }
            ],
            "footer": {
              "text": "Система наказаний"
            }
          }]
        }

  Telegram:
    enable: false
    bot-token: ''
    chat-id: ''
    templates:
      jailed: |
        {
          "text": "<b>🔒 Игрок посажен в тюрьму</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ 📋 Причина: <i>{reason}</i>\n├ ⏱ Срок: <b>{duration}</b>\n└ 👮 Выдал: <code>{punisher}</code>",
          "parse_mode": "HTML"
        }
      released: |
        {
          "text": "<b>✅ Игрок освобождён</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ 🔓 Освободил: <code>{unjailer}</code>\n└ 📝 Причина: <i>{unjail_reason}</i>",
          "parse_mode": "HTML"
        }
      expired: |
        {
          "text": "<b>⌛ Срок наказания истёк</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n└ Статус: Срок полностью отбыт",
          "parse_mode": "HTML"
        }

