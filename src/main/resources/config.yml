# Как идёт срок и что сохраняется у игрока в тюрьме.
punishment:
  # Идёт ли время, пока игрока нет на сервере.
  offline-progress: false

  # Идёт ли время, пока игрок в AFK.
  # Работает только если установлен EssentialsX.
  afk-progress: false

  # Сохранять ли вещи при смерти.
  # Если deny.item.pick-up выключен, игрок не подберёт то, что с него выпало.
  keep-inventory-on-death: true

  # Как часто писать оставшееся время в базу, в секундах.
  # 600 = 10 минут. 0 отключает автосохранение.
  autosave: 600

# Скорборд справа. После освобождения возвращается прежний скорборд игрока.
# Плейсхолдеры: %punisher%, %reason%, %time%, %remaining%, %jail%, %player%
# Не больше 15 строк — лимит ванильного борда.
scoreboard:
  enable: true
  title: "&6&lТюрьма"
  lines:
    - '&7&m---------------------'
    - '&cМодератор: &e%punisher%'
    - '&cПричина: &e%reason%'
    - ''
    - '&cСрок: &e%time%'
    - '&cОсталось: &6%remaining%'
    - '&7&m---------------------'

# Запреты, пока игрок сидит в тюрьме.
deny:
  # Голосовой чат: игрок не говорит, но слышать продолжает.
  # Нужен Simple Voice Chat и/или Plasmo Voice.
  voice-chat: true

  item:
    pick-up: true
    drop: true

  chat: true

  # Ходить нельзя, поворачивать голову можно.
  movement: false

  consume: false

  commands:
    enable: true
    # Со слэшем, в нижнем регистре.
    allowed-commands:
      - /rules
      - /links
      - /jailinfo

# Сообщения в игровой чат. Тексты лежат в messages.yml, секция announce.
# Пустой permission — сообщение видят все, иначе только игроки с этим правом.
announcements:
  chat:
    enable: true
    permission: ""

# Уведомления в Discord и Telegram.
# Для каждого события свой JSON-шаблон. Плагин подставляет значения вместо {плейсхолдеров}.
#
# События:
#   jailed   — игрока посадили
#   released — освободили командой
#   expired  — срок истёк
# Пустой шаблон ("") отключает это событие.
#
# Плейсхолдеры:
#   {player} {punisher} {reason} {jail} {duration}
#   {unjailer} {unjail_reason} {current_date} {punishment_date}
# Если значения нет, подставляется прочерк "—".
# HTML в значениях для Telegram экранируется.
#
# Discord: соберите сообщение на https://discohook.app и вставьте JSON.
# Оставьте "allowed_mentions": { "parse": [] }, иначе @everyone в причине пингует людей.
# URL: настройки канала → Интеграции → Вебхуки.
#
# Telegram: текст в поле "text", parse_mode остаётся "HTML".
# Теги: <b> <i> <u> <s> <code> <pre> <a href="..."> <blockquote>
# Перенос строки пишется как \n.
# Справка: https://core.telegram.org/bots/api#html-style
# Токен бота выдаёт @BotFather. В chat-id группы и канала id начинается с -100.
#
# URL и токен — секреты. После правок: /jailadmin reload
webhooks:
  discord:
    enable: false
    url: '<PASTE YOUR WEBHOOK URL HERE>'
    templates:
      jailed: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "🔒 Игрок посажен в тюрьму",
            "color": 15158332,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "⏱ Срок", "value": "{duration}", "inline": true },
              { "name": "🏛 Тюрьма", "value": "{jail}", "inline": true },
              { "name": "📋 Причина", "value": "{reason}", "inline": false },
              { "name": "👮 Выдал", "value": "`{punisher}`", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      released: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "✅ Игрок освобождён",
            "color": 3066993,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "🔓 Освободил", "value": "`{unjailer}`", "inline": true },
              { "name": "📝 Причина освобождения", "value": "{unjail_reason}", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }
      expired: |
        {
          "allowed_mentions": { "parse": [] },
          "embeds": [{
            "title": "⌛ Срок наказания истёк",
            "color": 3447003,
            "fields": [
              { "name": "👤 Игрок", "value": "`{player}`", "inline": true },
              { "name": "📌 Статус", "value": "Автоматически освобождён, срок полностью отбыт", "inline": false }
            ],
            "footer": { "text": "Система наказаний • {current_date}" }
          }]
        }

  telegram:
    enable: false
    bot-token: ''
    chat-id: ''
    templates:
      jailed: |
        {
          "parse_mode": "HTML",
          "text": "<b>🔒 Игрок посажен в тюрьму</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ ⏱ Срок: <b>{duration}</b>\n├ 🏛 Тюрьма: <code>{jail}</code>\n├ 📋 Причина: <i>{reason}</i>\n└ 👮 Выдал: <code>{punisher}</code>\n\n🕒 {current_date}"
        }
      released: |
        {
          "parse_mode": "HTML",
          "text": "<b>✅ Игрок освобождён</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n├ 🔓 Освободил: <code>{unjailer}</code>\n└ 📝 Причина освобождения: <i>{unjail_reason}</i>\n\n🕒 {current_date}"
        }
      expired: |
        {
          "parse_mode": "HTML",
          "text": "<b>⌛ Срок наказания истёк</b>\n\n┌ 👤 Игрок: <code>{player}</code>\n└ 📌 Статус: автоматически освобождён, срок полностью отбыт\n\n🕒 {current_date}"
        }

# Точки тюрем. Заполняется командами, вручную тут ничего трогать не имеет смысла =)
jails: {}
